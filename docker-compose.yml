name: bond-trading

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bond_trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bond_trading_local}
      POSTGRES_DB: ${POSTGRES_DB:-bond_trading}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: deploy/minio/Dockerfile
    image: bond-trading-minio:release-2025-10-15
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bond-trading}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: bond-trading-backend:local
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOND_TRADING__DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-bond_trading}:${POSTGRES_PASSWORD:-bond_trading_local}@postgres:5432/${POSTGRES_DB:-bond_trading}

  backend:
    build: .
    image: bond-trading-backend:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      BOND_TRADING__DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-bond_trading}:${POSTGRES_PASSWORD:-bond_trading_local}@postgres:5432/${POSTGRES_DB:-bond_trading}
      BOND_TRADING__ENVIRONMENT: development
      BOND_TRADING__STORAGE__ENDPOINT: minio:9000
      BOND_TRADING__STORAGE__ACCESS_KEY: ${MINIO_ROOT_USER:-bond-trading}
      BOND_TRADING__STORAGE__SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      BOND_TRADING__AUTH__BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-admin-2026}
      BOND_TRADING__AUTH__BOOTSTRAP_USER1_PASSWORD: ${BOOTSTRAP_USER1_PASSWORD:-change-me-user1-2026}
      BOND_TRADING__AUTH__BOOTSTRAP_USER2_PASSWORD: ${BOOTSTRAP_USER2_PASSWORD:-change-me-user2-2026}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.8.1
    profiles: ["monitoring"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
