name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      BOND_TRADING__AUTH__BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password-2026
      BOND_TRADING__AUTH__BOOTSTRAP_USER1_PASSWORD: ci-only-user1-password-2026
      BOND_TRADING__AUTH__BOOTSTRAP_USER2_PASSWORD: ci-only-user2-password-2026
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          python-version: "3.13.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest
      - run: docker compose config --quiet
      - run: docker build --tag bond-trading:test .
      - run: docker build --tag bond-trading-minio:test --file deploy/minio/Dockerfile .
