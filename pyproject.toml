[project]
name = "bond-trading"
version = "0.1.0"
description = "Bond portfolio yield tracking application"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18.5,<2",
    "asyncpg>=0.31.0,<1",
    "fastapi>=0.139.0,<1",
    "httpx>=0.28.1,<1",
    "jinja2>=3.1.6,<4",
    "openpyxl>=3.1.5,<4",
    "prometheus-client>=0.25.0,<1",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy>=2.0.51,<3",
    "tenacity>=9.1.4,<10",
    "uvicorn[standard]>=0.41.0,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1,<1",
    "coverage[toml]>=7.13.4,<8",
    "mypy>=2.2.0,<3",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "respx>=0.22.0,<1",
    "ruff>=0.15.21,<1",
]

[project.scripts]
bond-trading = "bond_trading.main:run"

[build-system]
requires = ["hatchling>=1.29.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bond_trading"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["live: opt-in tests that access external services"]

[tool.coverage.run]
branch = true
source = ["bond_trading.domain.calculations"]

[tool.coverage.report]
show_missing = true
fail_under = 95
