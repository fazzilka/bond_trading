{% extends "base.html" %}
{% block title %}Настройки · Bond Trading{% endblock %}
{% block content %}<section class="page-head"><div><p class="eyebrow">Расчёты</p><h1>Настройки</h1></div></section>
<form class="card narrow form-stack" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>TTL рыночных данных, секунд<input type="number" name="market_data_ttl_seconds" min="60" value="{{ settings.market_data_ttl_seconds }}"></label><label>Налоговый режим<select name="tax_mode">{% for mode in tax_modes %}<option value="{{ mode.value }}" {% if settings.tax_mode == mode %}selected{% endif %}>{{ mode.value }}</option>{% endfor %}</select></label><label>Ставка налога (доля)<input type="number" name="tax_rate" min="0" max="1" step="0.01" value="{{ settings.tax_rate }}"></label><label>Комиссия продажи за бумагу<input type="number" name="default_sale_commission_rub_per_bond" min="0" step="0.01" value="{{ settings.default_sale_commission_rub_per_bond }}"></label><button>Сохранить</button><p class="muted">Расчёт после налога является оценочным и не является налоговой консультацией.</p></form>{% endblock %}
